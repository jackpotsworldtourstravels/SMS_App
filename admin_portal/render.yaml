databases:
  - name: sms-frwd-db
    plan: free
    databaseName: admin_portal
    user: admin_portal

services:
  - type: web
    name: sms-frwd-admin-portal
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "flask db upgrade"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_CONFIG
        value: app.config.ProdConfig
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sms-frwd-db
          property: connectionString
      - key: DEVICE_OFFLINE_THRESHOLD_MINUTES
        value: "20"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "1200"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.13.7
