services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin_portal
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: admin_portal_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
